<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Barberia Frisor</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <header>
        <div class="caja">
            <h1><img src="imagenes/logo.png" alt="Logo de la Barberia"></h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="contenedor-formulario">
        <h1 class="titulo-formulario">Agenda tu cita</h1>
        <form id="formCita" action="agendar-cita" method="POST">
            <div class="seccion-fecha">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
                <div class="seccion-hora">
                    <label for="hora">Hora:</label>
                    <select id="hora" name="hora" required>
                        <option value="">Seleccione una hora</option>
                        <optgroup label="Mañana">
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                        </optgroup>
                        <optgroup label="Tarde">
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                        </optgroup>
                    </select>
                </div>
            <div class="seccion-datos">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="seccion-servicio">
                <label for="servicio">¿Qué servicio requieres?</label>
                <select id="servicio" name="servicio" required>
                    <option value="">Seleccione un servicio</option>
                    <option value="corte_cabello">Corte de cabello</option>
                    <option value="afeitado">Corte y Diseño de Barba</option>
                    <option value="barba">Corte de Cabello + Barba</option>
                </select>
            </div>
            <div class="seccion-barbero">
                <label for="barbero">Seleccione un barbero:</label>
                <select id="barbero" name="barbero_id" required>
                    <option value="">Seleccione un barbero</option>
                </select>
            </div>
            <button type="submit">Enviar</button>
            <button type="button" onclick="resetForm()">Cancelar</button>
        </form>
    </div>
    <div class="card">
        <div class="card-body">
            <p> 💈★★★  Horario de atención de Lunes a Sábado de 9:00 a 19:00 hrs. ★★★💈 </p>
        </div>
    </div>
    <footer>
        <img src="imagenes/logo-blanco.png" alt="logo de la Barberia">
        <p class="copyright">&copy Copyright Barberia Frisor - 2024</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await axios.get('/barberos');
                const barberos = response.data;
                const barberoSelect = document.getElementById('barbero');
                barberos.forEach(barbero => {
                    const option = document.createElement('option');
                    option.value = barbero.id;
                    option.textContent = barbero.nombre;
                    barberoSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar los barberos:', error);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const fechaInput = document.getElementById('fecha');
            const horaSelect = document.getElementById('hora');
            const today = new Date().toISOString().split('T')[0];

            // Deshabilitar el campo de hora inicialmente
            horaSelect.disabled = true;

            fechaInput.setAttribute('min', today);

            fechaInput.addEventListener('change', () => {
                const selectedDate = fechaInput.value;
                const currentTime = new Date();

                // Habilitar el campo de hora cuando se selecciona una fecha válida
                if (selectedDate) {
                    horaSelect.disabled = false;
                } else {
                    horaSelect.disabled = true;
                }

                horaSelect.querySelectorAll('option').forEach(option => {
                    option.disabled = false;
                });

                if (selectedDate === today) {
                    horaSelect.querySelectorAll('option').forEach(option => {
                        const [hour, minute] = option.value.split(':');
                        const optionTime = new Date();
                        optionTime.setHours(hour, minute, 0, 0);

                        if (optionTime < currentTime) {
                            option.disabled = true;
                        }
                    });
                }
            });
        });

        
        document.getElementById('formCita').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            axios.post('/agendar-cita', JSON.stringify(data), {
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(function(response) {
                alert('Cita agendada con éxito');
                document.getElementById('formCita').reset();
            })
            .catch(function(error) {
                console.error('Error al agendar la cita:', error);
                alert('Error al agendar la cita');
            });
        });
        
        function resetForm() {
            document.getElementById('formCita').reset();
        }
        </script>        
</body>
</html>
