<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesión</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <h2>Bienvenido</h2>
        <form id="login-form">
            <div class="input-field">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-field">
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <a href="#" class="forgot" id="forgotPasswordBtn">
                <p>¿Has olvidado tu contraseña?</p>
            </a>            
            <button type="submit" class="login">Iniciar Sesión</button>
            <p>¿No tienes una cuenta? <a href="register.html" class="sign-up">Regístrate</a></p>
        </form>
    </div>

    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Recuperar Contraseña</h2>
            <p>Introduce tu correo electrónico para buscar tu cuenta.</p>
            <form id="forgotPasswordForm">
                <input type="email" id="recoveryEmail" placeholder="Correo electrónico" required>
                <button type="submit">Enviar enlace de recuperación</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="/login.js"></script>
    <script src="/forgotPassword.js"></script>
</body>
</html>
